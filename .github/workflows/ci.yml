# CI do front (§9.5). Actions fixadas por SHA (§7.7, S25).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run api:check
      # A cópia byte a byte da IV só se compara quando ../identidade existe; no CI fica o controlo de cores literais.
      - run: npm run tokens:check
      - run: npx vitest run --coverage
      - name: Build de produção + verificação do bundle
        run: npm run build
        env:
          VITE_API_URL: https://syyt.tech
      # Bloqueia em vulnerabilidades altas nas dependências que vão para o bundle.
      # As de build (Tailwind v3 → braces) ficam visíveis no passo seguinte, sem bloquear.
      - run: npm run audit:prod
      - run: npm audit --audit-level=critical
      - run: npm run licenses

  interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build para o e2e (API simulada em localhost)
        run: npx vite build
        env:
          VITE_API_URL: http://localhost:5080
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
